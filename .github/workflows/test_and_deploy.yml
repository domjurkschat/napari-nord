name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: "true"
      # Validates the installed manifest, so a missing package-data entry fails too.
      - run: uv pip install . npe2 && npe2 validate napari-nord

  build-and-inspect-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hynek/build-and-inspect-python-package@v2

  deploy:
    # Runs on v* tags; publishes via PyPI trusted publishing.
    needs: [test, build-and-inspect-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
